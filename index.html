<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pregunta</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            /* Fondo rosa degradado */
            background: linear-gradient(135deg, #ff9ecf, #ffc0cb);
        }

        .caja {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #ff4d88;
        }

        #contenedor {
            position: relative;
            width: 300px;
            height: 200px;
            margin: auto;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: 0.3s;
        }

        #si {
            position: absolute;
            left: 50px;
            top: 50px;
            background-color: #ff4d88;
            color: white;
        }

        #no {
            position: absolute;
            left: 150px;
            top: 50px;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div class="caja">
        <h1>¿Soy tonta?</h1>

        <div id="contenedor">
            <button id="si">Sí</button>
            <button id="no">No</button>
        </div>
    </div>

    <script>
        const botonSi = document.getElementById("si");
        const botonNo = document.getElementById("no");

        // Hace que el botón "Sí" se mueva
        botonSi.addEventListener("mouseover", function() {
            const x = Math.random() * 250;
            const y = Math.random() * 150;

            botonSi.style.left = x + "px";
            botonSi.style.top = y + "px";
        });

        // Mensaje al presionar "No"
        botonNo.addEventListener("click", function() {
            alert("Exacto, sos muy inteligente Helen");
        });
    </script>

</body>
</html>
